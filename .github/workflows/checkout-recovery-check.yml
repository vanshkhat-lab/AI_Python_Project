name: ResumeIQ checkout recovery regression
on:
  push:
    branches: [fix/checkout-confirmation-recovery]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ResumeIQ-Final/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ResumeIQ-Final/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
