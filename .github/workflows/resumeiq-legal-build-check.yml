name: ResumeIQ legal pages frontend build check
on:
  push:
    branches: [qa/legal-build-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ResumeIQ-Final/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ResumeIQ-Final/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build legal pages
        run: npm run build
